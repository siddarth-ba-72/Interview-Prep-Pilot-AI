spring:
  application:
    name: user-service
  data:
    mongodb:
      uri: "${MONGODB_URI}"
      database: users_db
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            client-secret: "${GOOGLE_CLIENT_SECRET}"
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

jwt:
  secret: "${JWT_SECRET}"
  access-token-expiry-ms: 1800000   # 30 minutes
  refresh-token-expiry-days: 30

frontend:
  origin: "${FRONTEND_ORIGIN}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8081
