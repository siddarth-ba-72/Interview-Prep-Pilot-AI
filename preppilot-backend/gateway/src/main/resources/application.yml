spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${prep-pilot.frontend-url}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: oauth2-routes
          uri: ${prep-pilot.user-service-url}
          predicates:
            - Path=/oauth2/**,/login/oauth2/**
        - id: auth-routes
          uri: ${prep-pilot.user-service-url}
          predicates:
            - Path=/api/v1/auth/**
        - id: user-routes
          uri: ${prep-pilot.user-service-url}
          predicates:
            - Path=/api/v1/users/**
        - id: topic-routes
          uri: ${prep-pilot.topic-service-url}
          predicates:
            - Path=/api/v1/topics/**,/api/v1/sessions/**,/api/v1/reports/**
        - id: ai-routes
          uri: ${prep-pilot.ai-service-url}
          predicates:
            - Path=/api/v1/ai/**

jwt:
  secret: "${JWT_SECRET}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
