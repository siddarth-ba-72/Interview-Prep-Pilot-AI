name: AI Service Lint

on:
  push:
    branches: [main]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-service/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pylint

      - name: Lint with flake8
        working-directory: ai-service
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Check imports with pylint
        working-directory: ai-service
        run: pylint --disable=all --enable=F,E *.py || true
