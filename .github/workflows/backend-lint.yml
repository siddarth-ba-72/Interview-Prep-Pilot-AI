name: Backend Services Lint & Build

on:
  push:
    branches: [main]
    paths:
      - 'preppilot-backend/**'
      - '.github/workflows/backend-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'preppilot-backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, user-service, topic-service, cache-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build ${{ matrix.service }}
        working-directory: preppilot-backend
        run: ./gradlew :${{ matrix.service }}:build -x test --no-daemon
