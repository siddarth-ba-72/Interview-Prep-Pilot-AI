name: Backend Services Lint & Build

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'user-service/**'
      - 'topic-service/**'
      - '.github/workflows/backend-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'user-service/**'
      - 'topic-service/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, user-service, topic-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: ./gradlew build -x test --no-daemon

      - name: Check code style
        working-directory: ${{ matrix.service }}
        run: ./gradlew checkstyleMain -x test --no-daemon || echo "Checkstyle warnings (non-blocking)"
